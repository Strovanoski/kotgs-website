<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knights of the Golden Spoon - Monsters & Memories Guild</title>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gold: {
                            50: '#fffbeb', 100: '#fef3c7', 200: '#fde68a',
                            300: '#fcd34d', 400: '#fbbf24', 500: '#f59e0b',
                            600: '#d97706', 700: '#b45309', 800: '#92400e',
                            900: '#78350f', 950: '#451a03',
                        }
                    },
                    fontFamily: { serif: ['Georgia', 'serif'] }
                }
            }
        }
    </script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-gold-700 selection:text-white">

    <!-- Header Navigation -->
    <header class="bg-slate-900 border-b border-gold-800/40 sticky top-0 z-50 backdrop-blur-md bg-opacity-95">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('home')">
                    <div class="p-2.5 bg-gradient-to-br from-gold-600 to-amber-950 rounded-lg shadow-lg border border-gold-400/30">
                        <svg class="w-8 h-8 text-gold-100" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M12 2A4 4 0 0 0 8 6c0 3.31 4 9 4 9s4-5.69 4-9a4 4 0 0 0-4-4zm0 2c1.1 0 2 .9 2 2s-2 3.5-2 3.5S10 8 10 6s.9-2 2-2zm-1 11h2v7h-2z"/>
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-xl md:text-2xl font-bold font-serif tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-gold-100 via-gold-400 to-amber-500">
                            Knights of the Golden Spoon
                        </h1>
                        <p class="text-[10px] uppercase tracking-widest text-gold-500 font-semibold">Monsters & Memories Guild</p>
                    </div>
                </div>

                <nav class="hidden md:flex space-x-1">
                    <button onclick="switchTab('home')" id="nav-home" class="px-4 py-2 rounded-md text-sm font-medium transition-colors text-gold-400 bg-slate-800/60 border border-gold-900/30">Home</button>
                    <button onclick="switchTab('roster')" id="nav-roster" class="px-4 py-2 rounded-md text-sm font-medium transition-colors text-slate-300 hover:text-gold-400 hover:bg-slate-800/30">Roster</button>
                    <button onclick="switchTab('recruitment')" id="nav-recruitment" class="px-4 py-2 rounded-md text-sm font-medium transition-colors text-slate-300 hover:text-gold-400 hover:bg-slate-800/30">Apply</button>
                    <button onclick="switchTab('news-archive')" id="nav-news-archive" class="px-4 py-2 rounded-md text-sm font-medium transition-colors text-slate-300 hover:text-gold-400 hover:bg-slate-800/30">Chronicles</button>
                    <button onclick="switchTab('profile')" id="nav-profile" class="hidden px-4 py-2 rounded-md text-sm font-medium transition-colors text-slate-300 hover:text-gold-400 hover:bg-slate-800/30">My Profile</button>
                    <button onclick="switchTab('officer')" id="nav-officer" class="hidden px-4 py-2 rounded-md text-sm font-medium transition-colors text-slate-300 hover:text-gold-400 hover:bg-slate-800/30 flex items-center space-x-1">
                        <span>Officers</span>
                        <span id="nav-badge" class="hidden bg-red-600 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full ml-1">0</span>
                    </button>
                </nav>

                <div class="hidden lg:flex items-center space-x-3">
                    <a href="https://discord.gg/wKzW4VBAK6" id="discord-header-btn" target="_blank" class="flex items-center space-x-2 text-slate-300 hover:text-indigo-400 transition-colors text-sm bg-slate-800/80 px-3.5 py-2 rounded-lg border border-slate-700/50">
                        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.094 13.094 0 0 1-1.873-.894.077.077 0 0 1-.008-.128c.126-.093.252-.19.372-.287a.075.075 0 0 1 .077-.011c3.92 1.793 8.18 1.793 12.061 0a.073.073 0 0 1 .078.009c.12.099.246.195.373.289a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.894.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.156 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.156-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.156 2.418z"/></svg>
                        <span class="font-semibold text-xs tracking-wider">JOIN DISCORD</span>
                    </a>
                    <div id="auth-header-logged-out">
                        <button onclick="loginWithDiscord()" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold text-xs rounded-lg transition-colors tracking-wider">MEMBER LOGIN</button>
                    </div>
                    <div id="auth-header-logged-in" class="hidden flex items-center space-x-2">
                        <span id="header-user-name" class="text-xs text-gold-400 font-semibold cursor-pointer" onclick="switchTab('profile')"></span>
                        <button onclick="logout()" class="px-2.5 py-1.5 bg-slate-800 hover:bg-red-900/60 text-slate-300 hover:text-red-200 text-xs rounded border border-slate-700 transition-colors">Sign Out</button>
                    </div>
                </div>

                <div class="md:hidden">
                    <button onclick="toggleMobileMenu()" class="text-slate-400 hover:text-gold-400 p-2 focus:outline-none">
                        <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"/></svg>
                    </button>
                </div>
            </div>
        </div>

        <div id="mobile-menu" class="hidden md:hidden bg-slate-900 border-b border-gold-900/50 px-4 py-3 space-y-2">
            <button onclick="switchTab('home'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded text-base font-medium text-gold-400 bg-slate-800">Home</button>
            <button onclick="switchTab('roster'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded text-base font-medium text-slate-300 hover:text-gold-400">Roster</button>
            <button onclick="switchTab('recruitment'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded text-base font-medium text-slate-300 hover:text-gold-400">Apply</button>
            <button onclick="switchTab('news-archive'); toggleMobileMenu()" class="block w-full text-left px-3 py-2 rounded text-base font-medium text-slate-300 hover:text-gold-400">Chronicles</button>
            <button onclick="switchTab('profile'); toggleMobileMenu()" id="mobile-nav-profile" class="hidden block w-full text-left px-3 py-2 rounded text-base font-medium text-slate-300 hover:text-gold-400">My Profile</button>
            <button onclick="switchTab('officer'); toggleMobileMenu()" id="mobile-nav-officer" class="hidden block w-full text-left px-3 py-2 rounded text-base font-medium text-slate-300 hover:text-gold-400">Officer Center</button>
            <button onclick="loginWithDiscord()" class="block w-full text-center px-3 py-2 rounded text-base font-medium text-white bg-indigo-600 hover:bg-indigo-700">Member Login</button>
        </div>
    </header>

    <div id="notification-container" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-3 pointer-events-none max-w-sm w-full"></div>

    <main class="flex-grow">
        <!-- Views: Home, News Archive, Roster, Profile, Recruitment, Officer Center -->
        <!-- [HTML body views stay intact] -->
    </main>

    <footer class="bg-slate-950 border-t border-slate-900/60 py-8 text-center text-slate-500 text-xs">
        <div class="max-w-7xl mx-auto px-4 space-y-4">
            <p>© 2026 Knights of the Golden Spoon. Handcrafted for Monsters & Memories. All rights reserved.</p>
        </div>
    </footer>

    <!-- Modular JS Scripts -->
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/roster.js"></script>
    <script src="js/news.js"></script>
    <script src="js/events.js"></script>
</body>
</html>
