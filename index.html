<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guild Portal</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background-color: #121212; color: #e0e0e0; }
    .card { background: #1e1e1e; padding: 20px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; }
    button { background: #5865F2; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #4752C4; }
    input, textarea, select { width: 100%; padding: 8px; margin: 8px 0; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; box-sizing: border-box; }
    .hidden { display: none; }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { padding: 10px; border: 1px solid #333; text-align: left; }
    th { background-color: #2a2a2a; }
  </style>
</head>
<body>

  <h1>Guild Portal</h1>

  <!-- Authentication Section -->
  <div class="card">
    <div id="auth-logged-out">
      <p>Log in with Discord to access officer tools.</p>
      <button onclick="loginWithDiscord()">Sign in with Discord</button>
    </div>
    <div id="auth-logged-in" class="hidden">
      <p>Welcome, <span id="user-display-name"></span>!</p>
      <button onclick="logout()">Sign Out</button>
    </div>
  </div>

  <!-- Guild Application Form -->
  <div class="card">
    <h2>Guild Application</h2>
    <form id="app-form" onsubmit="submitApplication(event)">
      <label>Character Name:</label>
      <input type="text" id="char-name" required placeholder="In-game character name">

      <label>Class / Archetype:</label>
      <input type="text" id="char-class" required placeholder="e.g. Cleric, Warrior">

      <label>Level:</label>
      <input type="number" id="char-level" required placeholder="Current level">

      <label>MMO Experience / Bio:</label>
      <textarea id="experience" rows="4" placeholder="Previous guilds, raid experience, goals"></textarea>

      <button type="submit">Submit Application</button>
    </form>
    <p id="app-status-msg"></p>
  </div>

  <!-- Officer Command Center (Visible when logged in) -->
  <div id="officer-center" class="card hidden">
    <h2>Officer Command Center</h2>
    <h3>Pending Applications</h3>
    <button onclick="fetchApplications()">Refresh Applications</button>
    <table>
      <thead>
        <tr>
          <th>Character</th>
          <th>Class</th>
          <th>Level</th>
          <th>Experience</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="applications-list">
        <tr><td colspan="6">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // Injected Credentials
    const SUPABASE_URL = "https://zzotvstvmnlmfrulxhvl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable__o4vTB20JE2br9c_F3p8rQ_ez98q06n";
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1531232336920711239/Wt-LiJ64wHumDL34ntEL0IEe2PqV5mBVYeN6GLZIvrDrbyi7kd3zEU8zdi7lRY_J6IGS";

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Initialize Auth State
    window.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      updateAuthUI(session);

      supabaseClient.auth.onAuthStateChange((_event, session) => {
        updateAuthUI(session);
      });
    });

    function updateAuthUI(session) {
      if (session) {
        document.getElementById('auth-logged-out').classList.add('hidden');
        document.getElementById('auth-logged-in').classList.remove('hidden');
        document.getElementById('officer-center').classList.remove('hidden');
        document.getElementById('user-display-name').innerText = session.user.user_metadata.full_name || session.user.email;
        fetchApplications();
      } else {
        document.getElementById('auth-logged-out').classList.remove('hidden');
        document.getElementById('auth-logged-in').classList.add('hidden');
        document.getElementById('officer-center').classList.add('hidden');
      }
    }

    async function loginWithDiscord() {
      await supabaseClient.auth.signInWithOAuth({
        provider: 'discord',
        options: { redirectTo: window.location.href }
      });
    }

    async function logout() {
      await supabaseClient.auth.signOut();
    }

    // Submit Application & Trigger Discord Webhook
    async function submitApplication(e) {
      e.preventDefault();
      const statusMsg = document.getElementById('app-status-msg');
      statusMsg.innerText = "Submitting...";

      const charName = document.getElementById('char-name').value;
      const charClass = document.getElementById('char-class').value;
      const charLevel = parseInt(document.getElementById('char-level').value);
      const experience = document.getElementById('experience').value;

      // 1. Insert into Supabase DB
      const { error } = await supabaseClient
        .from('applications')
        .insert([{ character_name: charName, character_class: charClass, character_level: charLevel, experience: experience }]);

      if (error) {
        statusMsg.innerText = "Error submitting application: " + error.message;
        return;
      }

      // 2. Send Discord Webhook Notification
      try {
        await fetch(DISCORD_WEBHOOK_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            embeds: [{
              title: "⚔️ New Guild Application Received!",
              color: 5814786,
              fields: [
                { name: "Character", value: charName, inline: true },
                { name: "Class", value: charClass, inline: true },
                { name: "Level", value: String(charLevel), inline: true },
                { name: "Experience / Bio", value: experience || "N/A" }
              ],
              footer: { text: "KOTGS Website Notification" }
            }]
          })
        });
      } catch (err) {
        console.error("Webhook error:", err);
      }

      statusMsg.innerText = "Application submitted successfully!";
      document.getElementById('app-form').reset();
    }

    // Fetch Pending Applications for Officers
    async function fetchApplications() {
      const tbody = document.getElementById('applications-list');
      tbody.innerHTML = "<tr><td colspan='6'>Fetching...</td></tr>";

      const { data, error } = await supabaseClient
        .from('applications')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan='6'>Error loading applications: ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6'>No applications found.</td></tr>";
        return;
      }

      tbody.innerHTML = data.map(app => `
        <tr>
          <td>${app.character_name}</td>
          <td>${app.character_class}</td>
          <td>${app.character_level}</td>
          <td>${app.experience || ''}</td>
          <td><strong>${app.status}</strong></td>
          <td>
            ${app.status === 'pending' ? `
              <button onclick="updateAppStatus('${app.id}', 'approved')">Approve</button>
              <button onclick="updateAppStatus('${app.id}', 'rejected')">Reject</button>
            ` : 'Done'}
          </td>
        </tr>
      `).join('');
    }

    async function updateAppStatus(id, newStatus) {
      const { error } = await supabaseClient
        .from('applications')
        .update({ status: newStatus })
        .eq('id', id);

      if (error) {
        alert("Error updating status: " + error.message);
      } else {
        fetchApplications();
      }
    }
  </script>
</body>
</html>
